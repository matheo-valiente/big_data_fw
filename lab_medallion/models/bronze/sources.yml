sources:
  - name: bronze
    description: Raw datasets generated by the dataset generators.
    config:
      meta:
        external_location: "read_csv('{{ env_var('BRONZE_PATH') }}/{name}.csv', strict_mode = false)"
    tables:
      - name: users
        description: Users generated by `dataset-users`, one row per user.
      - name: orders
        description: Orders generated by `dataset-orders`, one row per order.
